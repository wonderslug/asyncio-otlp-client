[project]
name = "asyncio-otlp-client"
version = "0.2.0"
description = "Pure-asyncio OpenTelemetry OTLP client"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Brian Towles", email = "brian@towles.com" }]
keywords = ["opentelemetry", "otlp", "asyncio", "aiohttp", "telemetry", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/wonderslug/asyncio-otlp-client"
Source = "https://github.com/wonderslug/asyncio-otlp-client"
Issues = "https://github.com/wonderslug/asyncio-otlp-client/issues"
Changelog = "https://github.com/wonderslug/asyncio-otlp-client/releases"

[project.optional-dependencies]
protobuf = ["opentelemetry-proto>=1.20"]
grpc = ["opentelemetry-proto>=1.20", "grpcio>=1.63"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6",
  "opentelemetry-proto>=1.20",
  "types-grpcio>=1.83.0.20260730",
  "orjson>=3.10",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otlp_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires a live otel-collector"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# orjson is an opportunistic, non-declared dependency (see encoding/json.py).
# It is normally absent, so mypy can't find it; ignore_missing_imports here
# (rather than an inline `type: ignore`) keeps mypy clean whether or not the
# checking environment happens to have it installed.
module = "orjson"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The generated opentelemetry.proto.*_pb2 modules ship their own mypy-protobuf
# .pyi stubs, but the hand-written google.protobuf.* base package (e.g.
# google.protobuf.message.DecodeError in encoding/protobuf.py,
# google.protobuf.json_format.Parse in the test suite's cross-encoder check)
# does not publish a py.typed marker or stub-only package here. Scoped to the
# whole subpackage rather than one module at a time, since more of its
# submodules turn up as this suite grows.
module = "google.protobuf.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
