name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v --cov=otlp_client --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  core-only:
    # Proves the core install needs nothing but aiohttp. If this job fails, an
    # optional extra leaked into the core import path.
    #
    # This job must NOT run `uv run pytest`: inside a uv project, `uv run` first
    # re-syncs the environment against pyproject.toml/uv.lock, which reinstalls
    # the default `dev` dependency-group (opentelemetry-proto, grpcio's stubs,
    # etc.) right before the tests run - silently defeating the whole point of
    # this job. Invoke the venv's pytest directly instead, and this job never
    # calls `uv run` at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install the package with no extras
        run: |
          uv venv
          uv pip install . pytest pytest-asyncio
      - name: Verify no optional extra is installed
        run: |
          leaked=""
          for pkg in grpcio protobuf opentelemetry-proto orjson; do
            if uv pip show "$pkg" >/dev/null 2>&1; then
              leaked="$leaked $pkg"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "optional extras leaked into the core install:$leaked"
            exit 1
          fi
      - name: Run the core-only suite
        run: |
          .venv/bin/pytest tests/test_core_only.py tests/test_encoding_json_metrics.py \
                            tests/test_client.py tests/test_processor.py -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - name: Start the collector
        run: |
          mkdir -p out && chmod 777 out
          docker compose -f docker-compose.test.yml up -d
      - name: Wait for the collector to accept connections
        run: |
          for _ in $(seq 1 30); do
            curl -sf -X POST http://localhost:4318/v1/metrics \
              -H 'Content-Type: application/json' -d '{}' && break
            sleep 1
          done
      - run: uv run pytest -m integration -v
      - if: always()
        run: docker compose -f docker-compose.test.yml logs
