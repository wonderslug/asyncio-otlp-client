name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored as a repository secret. Requires a one-time publisher
    # setup on pypi.org naming this repo, workflow and environment - see
    # CONTRIBUTING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/asyncio-otlp-client
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Build the sdist and wheel
        run: uv build
      - name: Check that the metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
